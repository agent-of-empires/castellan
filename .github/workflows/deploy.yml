name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v0.1.0)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'castellan-lambda-*.zip*' --dir dist
          (cd dist && sha256sum --check castellan-lambda-*.zip.sha256)
      # Role and function are managed in agent-of-empires/infra (aws/castellan.tf).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::745600963472:role/castellan-deploy
          aws-region: us-east-1
      - name: Update function code
        run: |
          zip=$(ls dist/castellan-lambda-*.zip)
          aws lambda update-function-code --function-name castellan \
            --zip-file "fileb://$zip" --output text --query LastModified
          aws lambda wait function-updated --function-name castellan
